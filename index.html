<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Merry Christmas</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Noto+Serif+SC:wght@400;700&family=Quicksand:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #000000;
        font-family: "Quicksand", "Noto Serif SC", sans-serif;
      }
      #canvas-container {
        width: 100vw;
        height: 100vh;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 1;
        /* Lighter center for better contrast */
        background: radial-gradient(circle at center, #11221c 0%, #000000 90%);
      }

      /* UI Overlay */
      #ui-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 10;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        /* Adjusted top padding to balance layout */
        padding-top: 4vh; 
        box-sizing: border-box;
      }

      /* Loading */
      #loader {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #000;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: opacity 0.8s ease-out;
      }
      .loader-text {
        color: #d4af37;
        font-family: "Cinzel", serif;
        font-size: 24px;
        margin-top: 20px;
        letter-spacing: 4px;
        text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
      }
      .loader-sub {
        color: #888;
        font-family: "Quicksand", sans-serif;
        font-size: 14px;
        margin-top: 10px;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 2px solid rgba(212, 175, 55, 0.2);
        border-top: 2px solid #d4af37;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      /* Typography */
      h1 {
        font-family: "Cinzel", serif;
        color: #fceea7;
        font-size: clamp(32px, 6vw, 70px); /* Slightly smaller max size */
        margin: 0;
        font-weight: 400;
        letter-spacing: 2px;
        text-shadow: 0 0 20px rgba(252, 238, 167, 0.4);
        background: linear-gradient(to bottom, #fff 0%, #eebb66 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        z-index: 20;
        pointer-events: auto;
      }

      /* Webcam & Skeleton */
      #webcam-wrapper {
        position: absolute;
        bottom: 30px;
        right: 30px;
        width: 180px; /* Reduced size */
        height: 135px; /* 4:3 Aspect Ratio */
        z-index: 30;
        pointer-events: auto;
        transition: height 0.3s ease;
      }
      
      #webcam-wrapper.minimized {
        height: 30px;
        width: 30px;
        overflow: visible;
      }

      /* Container for the mirrored content */
      #webcam-content {
        width: 100%;
        height: 100%;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid rgba(212, 175, 55, 0.5);
        background: #000;
        box-shadow: 0 0 20px rgba(0,0,0,0.5);
        transform: scaleX(-1); /* Mirror effect only on content */
        transition: opacity 0.3s ease;
      }
      
      #webcam-wrapper.minimized #webcam-content {
        opacity: 0;
        pointer-events: none;
      }

      #webcam {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      #output_canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }

      /* Toggle Button */
      #webcam-toggle {
        position: absolute;
        top: -12px;
        right: -12px;
        width: 24px;
        height: 24px;
        background: #d4af37;
        color: #000;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 14px;
        font-weight: bold;
        z-index: 40;
        box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        border: 2px solid #000;
        transition: transform 0.2s;
      }
      #webcam-toggle:hover {
        transform: scale(1.1);
      }

      /* Instructions */
      .help-btn {
        position: absolute;
        bottom: 40px;
        left: 40px;
        background: rgba(0, 0, 0, 0.6);
        border: 1px solid rgba(212, 175, 55, 0.4);
        color: #d4af37;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 20px;
        transition: all 0.3s;
        pointer-events: auto;
        z-index: 20;
        font-family: "Cinzel", serif;
        box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      }
      .help-btn:hover {
        background: rgba(212, 175, 55, 0.2);
        color: #fff;
        box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
      }

      .instruction-panel {
        position: absolute;
        bottom: 100px;
        left: 40px;
        width: 300px;
        background: rgba(8, 8, 8, 0.95);
        border: 1px solid rgba(212, 175, 55, 0.3);
        padding: 24px;
        border-radius: 16px;
        pointer-events: none;
        opacity: 0;
        transform: translateY(20px);
        transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        z-index: 20;
        box-shadow: 0 10px 40px rgba(0,0,0,0.6);
      }
      .instruction-panel.visible {
        opacity: 1;
        transform: translateY(0);
      }
      .instruction-header {
        color: #fceea7;
        font-size: 14px;
        margin-bottom: 20px;
        border-bottom: 1px solid rgba(212, 175, 55, 0.15);
        padding-bottom: 12px;
        letter-spacing: 3px;
        font-weight: 700;
        font-family: "Quicksand", sans-serif;
        text-transform: uppercase;
      }
      .instruction-item {
        display: flex;
        align-items: flex-start;
        margin-bottom: 20px;
        color: #fceea7;
      }
      .instruction-item:last-child {
        margin-bottom: 0;
      }
      .icon { 
        font-size: 20px; 
        margin-right: 15px; 
        min-width: 24px;
        text-align: center;
        color: #ffdb58;
      }
      .content {
        display: flex;
        flex-direction: column;
      }
      .title {
        font-family: "Quicksand", sans-serif;
        font-weight: 700;
        font-size: 15px;
        color: #fffaf0;
        margin-bottom: 4px;
      }
      .desc { 
        font-size: 13px; 
        line-height: 1.6; 
        color: #b0b0b0; 
        font-family: "Noto Serif SC", serif;
      }
    </style>

      // --- CONFIGURATION ---
      const CONFIG = {
        tree: {
          height: 32,

        ribbon: {

          greyBlue: 0x8D96BB,    
          rosePink: 0xFF8E99,    
          champagne: 0xFFF7DE,
          treeGreen: 0x4caf50, 
          star: 0xffeebb
        }
      };

      const STATE = {
        mode: "TREE", 
        focusIndex: -1,
        carouselVelocity: 0,
        carouselRotation: 0,
        lastSwipeTime: 0,
        hand: {
          detected: false,
          x: 0, y: 0, prevX: 0
        },
        autoRotateSpeed: 0.15
      };

      // Globals
      let scene, camera, renderer, composer;
      let clock = new THREE.Clock();
      let mainGroup, photoGroup, backgroundGroup;
      
      // Meshes
      let treeMesh, ornamentMesh;
      let snowPoints, bgStars, bgSnowPoints, bigSnowPoints;
      let realSnowMesh, realSnowData = [];

      let dummy = new THREE.Object3D();
      let colorDummy = new THREE.Color();

      // Data Arrays
      let treeData = [];

      let photoMeshes = [];

      async function init() {
        setupThree();
        
        // Start loading assets
        const loadPromise = loadTexturesAndCreatePhotos();
        
        createBackgroundStars();
        createBackgroundSnow(); 
        createBigSnow(); 
        createRealSnow(); 
        createSnow(); 
        createTree();
        createOrnaments();
        createTopStar();
        
        setupPostProcessing();
        setupInput();
        
        await loadPromise; // Wait for photos
        await setupMediaPipe();

        gsap.to("#loader", { opacity: 0, duration: 1, onComplete: () => document.getElementById("loader").remove() });
        
        animate();
      }

      function setupThree() {
        const container = document.getElementById("canvas-container");
        scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x111111, 0.006); 

        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 60);

        renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1; // Reduced from 1.8 to prevent blown-out brightness
        renderer.shadowMap.enabled = true; 
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        mainGroup = new THREE.Group();
        mainGroup.position.y = -1.5; 
        scene.add(mainGroup);
        
        // PhotoGroup inside mainGroup to rotate with tree in TREE mode
        // But we will manually control its rotation in SCATTER mode
        photoGroup = new THREE.Group();
        mainGroup.add(photoGroup);
        
        backgroundGroup = new THREE.Group();
        scene.add(backgroundGroup);

        // --- Lighting ---
        const ambient = new THREE.AmbientLight(0xffffff, 0.8); // Reduced intensity
        scene.add(ambient);

        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x080820, 0.8);
        scene.add(hemiLight);
        
        const spot = new THREE.SpotLight(0xffeebb, 2000);
        spot.position.set(10, 50, 20);
        spot.angle = 0.5;
        spot.penumbra = 0.5;
        spot.castShadow = true;
        spot.shadow.bias = -0.0001;
        spot.shadow.mapSize.width = 2048;
        spot.shadow.mapSize.height = 2048;
        scene.add(spot);

        const dirLight = new THREE.DirectionalLight(0xffffff, 2.5); // Reduced intensity
        dirLight.position.set(-10, 10, 50);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        scene.add(dirLight);

        const bottomLight = new THREE.PointLight(CONFIG.colors.champagne, 5, 60);
        bottomLight.position.set(0, -15, 10);
        scene.add(bottomLight);
      }

      function loadTexturesAndCreatePhotos() {
        return new Promise((resolve) => {
          const manager = new THREE.LoadingManager();
          const loader = new THREE.TextureLoader(manager);
          loader.setCrossOrigin('anonymous'); // Important: Fix CORS issues for external images
          
          const textures = [];
          
          const subText = document.getElementById("loader-sub");
          
          manager.onProgress = (url, itemsLoaded, itemsTotal) => {
             subText.textContent = `Loading Memory ${itemsLoaded}/${itemsTotal}`;
          };
          
          manager.onLoad = () => {
             // Use filter to remove any undefined entries from failed loads (although our error handler handles this now)
             const validTextures = textures.filter(t => t);
             if (validTextures.length > 0) {
                 createPhotosFromTextures(validTextures);
             } else {
                 console.warn("No valid images loaded.");
             }
             resolve();
          };
          
          manager.onError = (url) => {
             console.warn("Error event in manager for:", url);
          };

          IMAGE_URLS.forEach((url, index) => {
            loader.load(
              url, 
              (tex) => {
                tex.colorSpace = THREE.SRGBColorSpace;
                textures[index] = tex;
              },
              undefined,
              (err) => {
                console.warn(`Error loading texture ${url}, generating fallback.`);
                // Robust Fallback: Generate a placeholder texture canvas immediately
                // so we don't depend on another network request.
                const canvas = document.createElement('canvas');
                canvas.width = 400; canvas.height = 500;
                const ctx = canvas.getContext('2d');
                
                // Background
                ctx.fillStyle = '#1a1a1a';
                ctx.fillRect(0,0,400,500);
                
                // Border/Decor
                ctx.strokeStyle = '#d4af37';
                ctx.lineWidth = 10;
                ctx.strokeRect(20,20,360,460);
                
                // Text
                ctx.fillStyle = '#d4af37';
                ctx.font = 'bold 40px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('Memory', 200, 230);
                ctx.font = '30px sans-serif';
                ctx.fillText('#' + (index + 1), 200, 280);
                
                const fallbackTex = new THREE.CanvasTexture(canvas);
                fallbackTex.colorSpace = THREE.SRGBColorSpace;
                
                // Assign to the correct index to maintain order
                textures[index] = fallbackTex;
              }
            );
          });
          
          // Fallback check: if IMAGE_URLS is empty, resolve immediately
          if (IMAGE_URLS.length === 0) resolve();
        });
      }

      function createPhotosFromTextures(textures) {
        // Polaroid Frame Geometry
        // Standard vertical polaroid: ~3.5 x 4.2 ratio
        // We use a box for thickness
        const frameGeo = new THREE.BoxGeometry(3.6, 4.4, 0.05);
        const frameMat = new THREE.MeshStandardMaterial({ 
            color: 0xfffaf0, 
            roughness: 0.8, 
            metalness: 0.1 
        }); // Paper texture color

        const count = textures.length;

        textures.forEach((tex, i) => {
          const group = new THREE.Group();

          // Check aspect ratio for smart orientation
          // Safely check image dimensions
          let isLandscape = false;
          if (tex.image) {
             isLandscape = tex.image.width > tex.image.height;
          }
          
          // Frame Mesh
          const frame = new THREE.Mesh(frameGeo, frameMat);
          frame.castShadow = true;
          frame.receiveShadow = true;
          
          // Photo Plane
          // Fits inside the frame with top/side padding and larger bottom padding
          // Use MeshStandardMaterial to react to lighting (fixes brightness issue)
          const photoGeo = new THREE.PlaneGeometry(3.2, 3.2); // Square-ish window
          const photoMat = new THREE.MeshStandardMaterial({ 
              map: tex, 
              side: THREE.DoubleSide,
              roughness: 0.6,
              metalness: 0.1
          });
          const photo = new THREE.Mesh(photoGeo, photoMat);
          photo.position.set(0, 0.3, 0.04); // Slightly raised on Z, shifted up on Y to leave bottom chin
          
          // Combine
          group.add(frame);
          group.add(photo);

          // If landscape, rotate the visual mesh group 90 degrees
          if (isLandscape) {
             group.rotation.z = -Math.PI / 2;
          }

          // --- Positions ---
          
          // 1. Tree Position (Spiral)
          const t = i / count; 
          const h = CONFIG.tree.height;
          const y = (1 - t) * h - (h/2) + Math.random()*2; // Vertical spread
          // Spiral radius
          const rTree = ((1 - (y + h/2)/h) * CONFIG.tree.radius) + 2.0; 
          const thetaTree = t * Math.PI * 2 * 4 + (Math.random()); // 4 turns
          
          const xTree = Math.cos(thetaTree) * rTree;
          const zTree = Math.sin(thetaTree) * rTree;
          
          const treePos = new THREE.Vector3(xTree, y, zTree);
          
          // Tree Rotation: Look away from center
          const dummyObj = new THREE.Object3D();
          dummyObj.position.copy(treePos);
          dummyObj.lookAt(0, y, 0); 
          // Flip because lookAt points +Z to target, we want photo facing out
          dummyObj.rotateY(Math.PI); 
          const treeRot = dummyObj.rotation.clone();

          // 2. Scatter Position (Ring Nebula)
          // Circular distribution
          const ringRadius = 24;
          const angle = (i / count) * Math.PI * 2;
          const xScat = Math.cos(angle) * ringRadius;
          const zScat = Math.sin(angle) * ringRadius;
          // Reduced random height to create a more defined ring shape
          const yScat = (Math.random() - 0.5) * 4; 
          
          const scatterPos = new THREE.Vector3(xScat, yScat, zScat);
          
          // Scatter Rotation: Look at center (0,0,0)
          dummyObj.position.copy(scatterPos);
          dummyObj.lookAt(0, 0, 0);
          const scatterRot = dummyObj.rotation.clone();

          // Set initial
          group.position.copy(treePos);
          group.rotation.copy(treeRot);
          
          // Data
          group.userData = {
            id: i,
            treePos: treePos,
            treeRot: treeRot,
            scatterPos: scatterPos,
            scatterRot: scatterRot,
            // Pre-calculate focus position (relative to camera or absolute)
            // We will calculate exact focus pos dynamically in animate
          };

          photoGroup.add(group);
          photoMeshes.push(group);
        });
      }

      function generateSnowflakeTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 128;
        canvas.height = 128;
        const ctx = canvas.getContext('2d');
        
        ctx.fillStyle = '#00000000'; 
        ctx.clearRect(0,0,128,128);
        
        ctx.translate(64, 64);
        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.shadowColor = 'rgba(255,255,255,0.8)';
        ctx.shadowBlur = 4;

        for(let i=0; i<6; i++) {
            ctx.save();
            ctx.rotate(i * Math.PI / 3);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(0, -48);
            ctx.stroke();
            
            // Branch 1
            ctx.beginPath();
            ctx.moveTo(0, -15);
            ctx.lineTo(-12, -28);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(0, -15);
            ctx.lineTo(12, -28);
            ctx.stroke();

            // Branch 2
            ctx.beginPath();
            ctx.moveTo(0, -30);
            ctx.lineTo(-10, -40);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(0, -30);
            ctx.lineTo(10, -40);
            ctx.stroke();
            
            ctx.restore();
        }
        
        const tex = new THREE.CanvasTexture(canvas);
        tex.needsUpdate = true;
        return tex;
      }

      async function setupMediaPipe() {
        const video = document.getElementById("webcam");
        const canvas = document.getElementById("output_canvas");
        const ctx = canvas.getContext("2d");
        drawingUtils = new DrawingUtils(ctx);

        const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
        handLandmarker = await HandLandmarker.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath: `https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task`,
            delegate: "GPU",
          },
          runningMode: "VIDEO",
          numHands: 1,
        });
        if (navigator.mediaDevices?.getUserMedia) {
           try {
             const stream = await navigator.mediaDevices.getUserMedia({ video: true });
             video.srcObject = stream;
             video.addEventListener("loadeddata", predictLoop);
           } catch(e) { console.warn("Cam fail", e); }
        }
      }

      let lastVideoTime = -1;
      function predictLoop() {
        const video = document.getElementById("webcam");
        const canvas = document.getElementById("output_canvas");
        const ctx = canvas.getContext("2d");
        
        if (video.currentTime !== lastVideoTime && video.readyState >= 2) {
          lastVideoTime = video.currentTime;
          
          if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
             canvas.width = video.videoWidth;
             canvas.height = video.videoHeight;
          }

          if(handLandmarker) {
            const res = handLandmarker.detectForVideo(video, performance.now());
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (res.landmarks) {
              for (const landmarks of res.landmarks) {
                drawingUtils.drawConnectors(landmarks, HandLandmarker.HAND_CONNECTIONS, {
                  color: "#d4af37",
                  lineWidth: 3
                });
                drawingUtils.drawLandmarks(landmarks, {
                  color: "#ffffff",
                  lineWidth: 1,
                  radius: 3
                });
              }
            }
            
            handleGestures(res);
          }
        }
        requestAnimationFrame(predictLoop);
      }

      function handleGestures(result) {
        if(!result.landmarks || result.landmarks.length === 0) {
           STATE.hand.detected = false;
           // Decelerate carousel if no hand
           STATE.carouselVelocity *= 0.95;
           return;
        }
        STATE.hand.detected = true;
        const lm = result.landmarks[0];
        
        const wrist = lm[0];
        const tips = [lm[8], lm[12], lm[16], lm[20]];
        let extended = 0;
        tips.forEach(t => {
           if(Math.hypot(t.x - wrist.x, t.y - wrist.y) > 0.15) extended++;
        });

        const thumb = lm[4];
        const index = lm[8];
        const pinchDist = Math.hypot(thumb.x - index.x, thumb.y - index.y);
        const currX = lm[9].x;

        // Interaction Logic
        if (pinchDist < 0.05) {
          if (STATE.mode !== 'FOCUS') {
             enterMode('FOCUS');
          }
          // Simple finding closest photo is complex without raycasting
          // For this demo, we assume the photo "in front" (rotation 0) is the focus one
          // OR we can cycle index on pinch drag?
          // Let's stick to: Pinch to Focus current front photo. 
          // Since we rotate the group, "Index 0" might not be front. 
          // We'll calculate the index based on current rotation.
          
          if (photoMeshes.length > 0 && STATE.focusIndex === -1) {
             // Calculate which photo is closest to angle 0 (front)
             const total = photoMeshes.length;
             // Current rotation is photoGroup.rotation.y
             // Photo angle is (i / total) * 2PI
             // We want (PhotoAngle + GroupRotation) % 2PI ≈ PI/2 (since camera is at +Z)
             // Actually camera is at +Z, so we want photo at +Z.
             
             // Simple fallback: just focus 0 if unset, or don't change index logic
             STATE.focusIndex = Math.floor(Math.random() * total); // Pick random for effect if not raycasting
          }

        } else if (extended >= 4) {
          if (STATE.mode !== 'SCATTER') {
             enterMode('SCATTER');
          }
          
          // Carousel Logic in Scatter Mode
          if (STATE.mode === 'SCATTER') {
             const diff = currX - STATE.hand.prevX;
             if (Math.abs(diff) > 0.005) {
                // Map hand movement to velocity
                STATE.carouselVelocity = diff * 5.0; // Sensitivity
             } else {
                STATE.carouselVelocity *= 0.9;
             }
          }

        } else if (extended <= 1) {
          if (STATE.mode !== 'TREE') {
             enterMode('TREE');
          }
        }
        
        STATE.hand.prevX = currX;
        STATE.hand.x = (lm[9].x - 0.5) * 2;
        STATE.hand.y = (lm[9].y - 0.5) * 2;
      }

      function enterMode(mode) {
        const prevMode = STATE.mode;
        STATE.mode = mode;
        
        if (mode === 'TREE') {
          gsap.to(camera.position, { x:0, y:0, z: 60, duration: 2, ease: "power2.inOut" });
          // Reset Photo Group rotation to align with tree?
          gsap.to(photoGroup.rotation, { y: 0, duration: 1 });
        } else if (mode === 'SCATTER') {
          gsap.to(camera.position, { x:0, y:0, z: 15, duration: 2.5, ease: "expo.out" }); // Inside the ring
          STATE.focusIndex = -1;
        } else if (mode === 'FOCUS') {
          // Find a photo to focus on. In a real app, raycast from hand.
          // Here, we just pick the one "in front" of the camera based on rotation
          if (STATE.focusIndex === -1) {
             const count = photoMeshes.length;
             // Normalize rotation to 0..2PI
             let rot = (photoGroup.rotation.y % (Math.PI*2));
             if (rot < 0) rot += Math.PI*2;
             
             // We want the photo that is at angle roughly -rot + PI/2 (+Z axis)
             // The angle of photo i is (i/count)*2PI
             // We want (i/count)*2PI + rot ≈ PI/2 (90 deg, facing +Z) or 3PI/2 (-Z)
             // Let's just pick one nearby for visual effect:
             STATE.focusIndex = Math.floor(Math.random() * count);
          }
        }
      }

      function animate() {
        requestAnimationFrame(animate);
        const dt = clock.getDelta();

        // Global Rotation Logic
        if (STATE.mode === 'SCATTER') {
           // Apply momentum
           STATE.carouselRotation += STATE.carouselVelocity * dt;
           STATE.carouselVelocity *= 0.95; // Friction
           photoGroup.rotation.y = STATE.carouselRotation;
           
           // Stop main group rotation so the ring is more stable and visible
           // mainGroup.rotation.y += 0.05 * dt; 

        } else if (STATE.mode === 'FOCUS') {
           // Stop rotation or very slow
           mainGroup.rotation.y += 0.01 * dt;
           STATE.carouselVelocity = 0;
        } else {
           // Tree Mode
           mainGroup.rotation.y += STATE.autoRotateSpeed * dt;
           // Sync photo group
           photoGroup.rotation.y = 0; 
        }

        // Background rotate slowly
        backgroundGroup.rotation.y -= 0.02 * dt;

        const lerpFactor = 2.5 * dt; // Speed of transition

        // Tree Particles
        for(let i=0; i<CONFIG.tree.particleCount; i++) {
          const d = treeData[i];
          // Scatter mode: explode outwards
          const target = (STATE.mode === 'SCATTER' || STATE.mode === 'FOCUS') ? d.scatterPos : d.treePos;
          d.currentPos.lerp(target, lerpFactor);
          dummy.position.copy(d.currentPos);
          dummy.rotation.copy(d.rot);
          let s = d.scale;
          if(STATE.mode === 'TREE') {
             s *= (0.85 + 0.15 * Math.sin(clock.elapsedTime * 3 + i));
          }
          dummy.scale.setScalar(s);
          dummy.updateMatrix();
          treeMesh.setMatrixAt(i, dummy.matrix);
        }
        treeMesh.instanceMatrix.needsUpdate = true;

        // Ornaments
        for(let i=0; i<CONFIG.ribbon.sphereCount; i++) {
          const d = ornamentData[i];
          const target = (STATE.mode === 'SCATTER' || STATE.mode === 'FOCUS') ? d.scatterPos : d.treePos;
          d.currentPos.lerp(target, lerpFactor);
          dummy.position.copy(d.currentPos);
          dummy.scale.setScalar(d.scale);
          dummy.updateMatrix();
          ornamentMesh.setMatrixAt(i, dummy.matrix);
        }
        ornamentMesh.instanceMatrix.needsUpdate = true;

        // Photos Logic
        photoMeshes.forEach((mesh, idx) => {
          const d = mesh.userData;
          
          // Determine Position
          let targetPos = new THREE.Vector3();
          let targetRot = new THREE.Euler();
          let targetScale = 1.0;

          if (STATE.mode === 'TREE') {
             targetPos.copy(d.treePos);
             targetRot.copy(d.treeRot);
          } else {
             // Scatter & Focus use ScatterPos (Ring)
             targetPos.copy(d.scatterPos);
             targetRot.copy(d.scatterRot);
          }

          // Special override for FOCUS mode
          if (STATE.mode === 'FOCUS' && idx === STATE.focusIndex) {
             // Move this specific photo to center front relative to camera
             // Since camera is at Z=15 or similar in Scatter, we put photo at Z=10, X=0
             // But we are inside `photoGroup` which is rotated. 
             // To simplify, we just project it out.
             
             // Reverse the group rotation for this item so it stays fixed in screen space? 
             // Hard to perfectly align without world conversion.
             // Simpler: Just scale it up and push it inwards to center
             targetPos.setLength(10); // Pull closer to center (radius was 24)
             targetPos.y = 0;
             targetScale = 2.5;
             // Look at camera
             mesh.lookAt(camera.position); 
             // Note: lookAt overrides rotation lerp, so we skip rot lerp below if focused
             mesh.position.lerp(targetPos, lerpFactor);
             mesh.scale.lerp(new THREE.Vector3(targetScale, targetScale, targetScale), lerpFactor);
          } else {
             // Normal behavior
             mesh.position.lerp(targetPos, lerpFactor);
             // Slerp rotation manually
             // Simple Euler lerp
             mesh.rotation.x += (targetRot.x - mesh.rotation.x) * lerpFactor;
             mesh.rotation.y += (targetRot.y - mesh.rotation.y) * lerpFactor;
             mesh.rotation.z += (targetRot.z - mesh.rotation.z) * lerpFactor;
             mesh.scale.lerp(new THREE.Vector3(1,1,1), lerpFactor);
          }
        });

        // Snow (Foreground)
        if(snowPoints) {
           const positions = snowPoints.geometry.attributes.position.array;
           const vels = snowPoints.geometry.userData.velocities;
           for(let i=0; i<CONFIG.snow.count; i++) {
             positions[i*3] += vels[i*3];     
             positions[i*3+1] += vels[i*3+1]; 
             positions[i*3+2] += vels[i*3+2]; 
             if(positions[i*3+1] < -CONFIG.snow.range/2) {
                positions[i*3+1] = CONFIG.snow.range/2;
             }
           }
           snowPoints.geometry.attributes.position.needsUpdate = true;
           snowPoints.rotation.y = -mainGroup.rotation.y * 0.5; 
        }

        // Background Snow
        if(bgSnowPoints) {
           const positions = bgSnowPoints.geometry.attributes.position.array;
           const vels = bgSnowPoints.geometry.userData.velocities;
           const count = positions.length / 3;
           const range = 120;
           for(let i=0; i<count; i++) {
             positions[i*3] += vels[i*3];     
             positions[i*3+1] += vels[i*3+1]; 
             positions[i*3+2] += vels[i*3+2]; 
             if(positions[i*3+1] < -range/2) {
                positions[i*3+1] = range/2;
             }
           }
           bgSnowPoints.geometry.attributes.position.needsUpdate = true;
           bgSnowPoints.rotation.y = -mainGroup.rotation.y * 0.2; 
        }

        // Big Snow
        if(bigSnowPoints) {
           const positions = bigSnowPoints.geometry.attributes.position.array;
           const vels = bigSnowPoints.geometry.userData.velocities;
           const count = positions.length / 3;
           const range = 100;
           for(let i=0; i<count; i++) {
             positions[i*3] += vels[i*3];     
             positions[i*3+1] += vels[i*3+1]; 
             positions[i*3+2] += vels[i*3+2]; 
             if(positions[i*3+1] < -range/2) {
                positions[i*3+1] = range/2;
             }
           }
           bigSnowPoints.geometry.attributes.position.needsUpdate = true;
           bigSnowPoints.rotation.y = -mainGroup.rotation.y * 0.1;
           bigSnowPoints.rotation.x = Math.sin(clock.elapsedTime * 0.1) * 0.1;
        }

        // Real Snow
        if(realSnowMesh) {
            for(let i=0; i<realSnowData.length; i++) {
               const d = realSnowData[i];
               d.pos.add(d.vel);
               if(d.pos.y < -40) d.pos.y = 40;
               if(d.pos.x > 40) d.pos.x = -40;
               if(d.pos.x < -40) d.pos.x = 40;
               
               d.rot.x += d.rotVel.x;
               d.rot.y += d.rotVel.y;
               d.rot.z += d.rotVel.z;
               
               dummy.position.copy(d.pos);
               dummy.rotation.copy(d.rot);
               dummy.updateMatrix();
               realSnowMesh.setMatrixAt(i, dummy.matrix);
            }
            realSnowMesh.instanceMatrix.needsUpdate = true;
        }

        composer.render();
      }

      init();
    </script>
  </body>
</html>
