      }
      /* Ensure pointer events work on interactive elements with the custom cursor */

        cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" style="fill:none;stroke-linecap:round"><defs><mask id="m"><path d="M12,10 A6,6 0 0,1 24,10 V28" stroke="white" stroke-width="6" fill="none"/></mask></defs><g transform="rotate(-45, 16, 16)"><!-- White Base --><path d="M12,10 A6,6 0 0,1 24,10 V28" stroke="white" stroke-width="6" fill="none"/><!-- Pink Stripes Masked --><g mask="url(%23m)"><path d="M0,4 h32 M0,9 h32 M0,14 h32 M0,19 h32 M0,24 h32 M0,29 h32" stroke="%23ffc0cb" stroke-width="2"/></g><!-- Shadow --><path d="M12,10 A6,6 0 0,1 24,10 V28" stroke="rgba(0,0,0,0.2)" stroke-width="7" fill="none" style="mix-blend-mode:multiply"/></g></svg>') 2 2, pointer;
      }
      #canvas-container {
        width: 100vw;
        height: 100vh;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 1;
        /* Lighter center for better contrast */
        background: radial-gradient(circle at center, #11221c 0%, #000000 90%);
      }

      /* UI Overlay */
      #ui-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 10;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        align-items: center;

      }

      /* Loading */

        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #000;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;

        transition: opacity 0.8s ease-out;

      .loader-text {

        font-family: "Cinzel", serif;
        font-size: 24px;
        margin-top: 20px;
        letter-spacing: 4px;
        text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
      }
      .loader-sub {
        color: #888;
        font-family: "Quicksand", sans-serif;
        font-size: 14px;
        margin-top: 10px;
      }

        height: 40px;
        border: 2px solid rgba(212, 175, 55, 0.2);
        border-top: 2px solid #d4af37;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {

        100% { transform: rotate(360deg); }

        -webkit-text-fill-color: transparent;
        z-index: 20;
        pointer-events: auto;

        right: 30px;

        width: 30px;
        overflow: visible;

        overflow: hidden;

      // Shooting Stars
      let shootingStar;
      function createShootingStarSystem() {
         const geo = new THREE.BufferGeometry();
         const positions = new Float32Array(2 * 3); // line segment
         geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
         
         const mat = new THREE.LineBasicMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0
         });
         
         shootingStar = new THREE.Line(geo, mat);
         scene.add(shootingStar);
         shootingStar.userData = { active: false, t: 0, start: new THREE.Vector3(), end: new THREE.Vector3() };
      }

      function updateShootingStar(dt) {
         if (!shootingStar) return;
         
         const data = shootingStar.userData;
         if (!data.active) {
            // Chance to spawn
            if (Math.random() < 0.01) { // 1% chance per frame
               data.active = true;
               data.t = 0;
               
               // Random start position in upper hemisphere
               const theta = Math.random() * Math.PI * 2;
               const phi = Math.acos(2 * Math.random() - 1);
               const r = 80;
               
               data.start.set(
                  r * Math.sin(phi) * Math.cos(theta),
                  Math.abs(r * Math.cos(phi)) + 10, // Keep upper
                  r * Math.sin(phi) * Math.sin(theta)
               );
               
               // End position (random direction downwards)
               data.end.copy(data.start).add(new THREE.Vector3(
                  (Math.random()-0.5)*60,
                  -(Math.random()*40 + 20),
                  (Math.random()-0.5)*60
               ));
            }
         } else {
            data.t += dt * 1.5; // Speed
            if (data.t > 1) {
               data.active = false;
               shootingStar.material.opacity = 0;
            } else {
               // Update line positions to simulate tail
               // Head is at lerp(start, end, t)
               // Tail is at lerp(start, end, t - 0.1)
               const head = new THREE.Vector3().copy(data.start).lerp(data.end, data.t);
               const tailT = Math.max(0, data.t - 0.15);
               const tail = new THREE.Vector3().copy(data.start).lerp(data.end, tailT);
               
               const pos = shootingStar.geometry.attributes.position;
               pos.setXYZ(0, head.x, head.y, head.z);
               pos.setXYZ(1, tail.x, tail.y, tail.z);
               pos.needsUpdate = true;
               
               // Fade in/out
               shootingStar.material.opacity = Math.sin(data.t * Math.PI);
            }
         }
      }

      function loadTexturesAndCreatePhotos() {
        return new Promise((resolve) => {
          const manager = new THREE.LoadingManager();
          const loader = new THREE.TextureLoader(manager);
          loader.setCrossOrigin('anonymous'); // Important: Fix CORS issues for external images
          
          const textures = [];
          
          const subText = document.getElementById("loader-sub");
          
          manager.onProgress = (url, itemsLoaded, itemsTotal) => {
             subText.textContent = `Loading Memory ${itemsLoaded}/${itemsTotal}`;
          };
          
          manager.onLoad = () => {
             // Use filter to remove any undefined entries from failed loads (although our error handler handles this now)
             const validTextures = textures.filter(t => t);
             if (validTextures.length > 0) {
                 createPhotosFromTextures(validTextures);
             } else {
                 console.warn("No valid images loaded.");
             }
             resolve();
          };
          
          manager.onError = (url) => {
             console.warn("Error event in manager for:", url);
          };

          IMAGE_URLS.forEach((url, index) => {
            loader.load(
              url, 
              (tex) => {
                tex.colorSpace = THREE.SRGBColorSpace;
                textures[index] = tex;
              },
              undefined,
              (err) => {
                console.warn(`Error loading texture ${url}, generating fallback.`);
                // Robust Fallback: Generate a placeholder texture canvas immediately
                // so we don't depend on another network request.
                const canvas = document.createElement('canvas');
                canvas.width = 400; canvas.height = 500;
                const ctx = canvas.getContext('2d');

                // Assign to the correct index to maintain order
                textures[index] = fallbackTex;

          if (IMAGE_URLS.length === 0) resolve();

      function createPhotosFromTextures(textures) {
        // Polaroid Frame Geometry
        // Standard vertical polaroid: ~3.5 x 4.2 ratio
        // We use a box for thickness
        const frameGeo = new THREE.BoxGeometry(3.6, 4.4, 0.05);
        const frameMat = new THREE.MeshStandardMaterial({ 
            color: 0xfffaf0, // Brighter frame color
            roughness: 0.4, 
            metalness: 0.1 
        }); 

        const count = textures.length;

        textures.forEach((tex, i) => {
          const group = new THREE.Group();

          // Check aspect ratio for smart orientation
          // Safely check image dimensions
          let isLandscape = false;
          if (tex.image) {
             isLandscape = tex.image.width > tex.image.height;
          }
          
          // Frame Mesh
          const frame = new THREE.Mesh(frameGeo, frameMat);
          frame.castShadow = true;
          frame.receiveShadow = true;
          
          // Photo Plane (Front)
          // Fits inside the frame with top/side padding and larger bottom padding
          const photoGeo = new THREE.PlaneGeometry(3.2, 3.2); // Square-ish window
          const photoMat = new THREE.MeshStandardMaterial({ 
              map: tex, 
              side: THREE.DoubleSide,
              roughness: 0.8, // High roughness to avoid specular glare
              metalness: 0.0,
              color: 0x888888, // Darker base color to compensate for bright scene lights
              emissive: 0x000000, // No self-glow
              emissiveIntensity: 0.0
          });
          const photo = new THREE.Mesh(photoGeo, photoMat);
          photo.position.set(0, 0.3, 0.04); // Slightly raised on Z, shifted up on Y to leave bottom chin
          
          // Photo Plane (Back)
          // Clone the front photo and rotate it to face backwards so we don't see a white box back
          const photoBack = photo.clone();
          photoBack.position.set(0, 0.3, -0.04); // Symmetric position on back
          photoBack.rotation.y = Math.PI; // Face backwards
          
          // Combine
          group.add(frame);
          group.add(photo);
          group.add(photoBack);

          // If landscape, rotate the visual mesh group 90 degrees
          if (isLandscape) {
             group.rotation.z = -Math.PI / 2;
          }

          // --- Positions ---
          
          // 1. Tree Position (Spiral)
          const t = i / count; 
          const h = CONFIG.tree.height;
          
          // Modified height distribution: Use power function to bunch more items at the bottom (t=1)
          // y goes from Top (h/2) to Bottom (-h/2)
          // t goes 0 -> 1
          // We want items to accumulate as t -> 1.
          const effectiveT = Math.pow(t, 0.7); // Non-linear distribution
          const y = (1 - effectiveT) * h - (h/2) + Math.random()*2;
          
          // Spiral radius
          // Adjust radius calc to match new y distribution
          // r is roughly linear with y, largest at bottom
          const radiusYScale = (1 - (y + h/2)/h);
          const rTree = (radiusYScale * CONFIG.tree.radius) + 2.0; 
          const thetaTree = t * Math.PI * 2 * 4 + (Math.random()); // 4 turns
          
          const xTree = Math.cos(thetaTree) * rTree;
          const zTree = Math.sin(thetaTree) * rTree;
          
          const treePos = new THREE.Vector3(xTree, y, zTree);
          
          // Tree Rotation: Look away from center
          const dummyObj = new THREE.Object3D();
          dummyObj.position.copy(treePos);
          dummyObj.lookAt(0, y, 0); 
          // Flip because lookAt points +Z to target, we want photo facing out
          dummyObj.rotateY(Math.PI); 
          const treeRot = dummyObj.rotation.clone();

          // 2. Scatter Position (Ring Nebula)
          // Circular distribution
          const ringRadius = 35; // Increased radius from 18 to 35 to separate images significantly
          const angle = (i / count) * Math.PI * 2;
          const xScat = Math.cos(angle) * ringRadius;
          const zScat = Math.sin(angle) * ringRadius;
          // Tighter vertical randomness to match the clean ring reference
          const yScat = (Math.random() - 0.5) * 3; 
          
          const scatterPos = new THREE.Vector3(xScat, yScat, zScat);
          
          // Scatter Rotation: Look OUTWARDS from center (Carousel style)
          dummyObj.position.copy(scatterPos);
          dummyObj.lookAt(0, 0, 0); // Looks at center (inwards)
          dummyObj.rotateY(Math.PI); // Rotate 180 to face outwards
          // Remove any tilt (X/Z rotation) so they stand perfectly straight up
          const scatterRot = new THREE.Euler(0, dummyObj.rotation.y, 0);

          // Set initial
          group.position.copy(treePos);
          group.rotation.copy(treeRot);
          
          // Data
          group.userData = {
            id: i,
            treePos: treePos,
            treeRot: treeRot,
            scatterPos: scatterPos,
            scatterRot: scatterRot,
            driftOffset: Math.random() * Math.PI * 2, // Random phase
            driftSpeed: 0.2 + Math.random() * 0.3,    // Random speed
            // Pre-calculate focus position (relative to camera or absolute)
            // We will calculate exact focus pos dynamically in animate
          };

          photoGroup.add(group);
          photoMeshes.push(group);
        });
      }

      function generateSnowflakeTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 128;
        canvas.height = 128;
        const ctx = canvas.getContext('2d');
        
        ctx.fillStyle = '#00000000'; 
        ctx.clearRect(0,0,128,128);
        
        ctx.translate(64, 64);
        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.shadowColor = 'rgba(255,255,255,0.8)';
        ctx.shadowBlur = 4;

        for(let i=0; i<6; i++) {
            ctx.save();
            ctx.rotate(i * Math.PI / 3);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(0, -48);
            ctx.stroke();
            
            // Branch 1
            ctx.beginPath();
            ctx.moveTo(0, -15);
            ctx.lineTo(-12, -28);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(0, -15);
            ctx.lineTo(12, -28);
            ctx.stroke();

            // Branch 2
            ctx.beginPath();
            ctx.moveTo(0, -30);
            ctx.lineTo(-10, -40);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(0, -30);
            ctx.lineTo(10, -40);
            ctx.stroke();
            
            ctx.restore();
        }
        
        const tex = new THREE.CanvasTexture(canvas);
        tex.needsUpdate = true;
        return tex;
      }

      function setupInput() {
        // Mouse Move Listener for Parallax
        window.addEventListener('mousemove', (e) => {
           mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
           mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

           // Handle Drag Rotation (only in TREE mode)
           if (isDragging && STATE.mode === 'TREE') {
               const deltaMove = {
                   x: e.clientX - previousMousePosition.x,
                   y: e.clientY - previousMousePosition.y
               };

               const rotateSpeed = 0.005;
               
               // Horizontal drag rotates around Y axis (Left/Right)
               mainGroup.rotation.y += deltaMove.x * rotateSpeed;
               
               // Vertical drag rotates around X axis (Up/Down)
               // Invert sign because dragging down should tilt forward (positive X) or backward depending on convention
               // Usually dragging down tilts it towards you (positive X)
               mainGroup.rotation.x += deltaMove.y * rotateSpeed;
               
               // Limit X rotation to avoid flipping upside down (e.g., -45 to +45 degrees)
               // Math.PI / 4 = 45 degrees
               mainGroup.rotation.x = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, mainGroup.rotation.x));

               dragVelocity = {
                   x: deltaMove.x * rotateSpeed,
                   y: deltaMove.y * rotateSpeed
               };

               previousMousePosition = {
                   x: e.clientX,
                   y: e.clientY
               };
           }
        });

        // Mouse Down for Dragging
        window.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousMousePosition = {
                x: e.clientX,
                y: e.clientY
            };
        });

        // Mouse Up to stop dragging
        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        // Double Click to Toggle Mode
        window.addEventListener('dblclick', () => {
            if (STATE.mode === 'TREE') {
                enterMode('SCATTER');
            } else if (STATE.mode === 'SCATTER' || STATE.mode === 'FOCUS') {
                enterMode('TREE');
            }
        });

        // Click to Focus Photo (in SCATTER mode)
        window.addEventListener('click', (e) => {
            // Only if not dragging (simple click)
            if (STATE.mode === 'SCATTER' || STATE.mode === 'FOCUS') {
                // Raycast
                raycaster.setFromCamera(mouse, camera);
                // Check intersections with photoMeshes
                // photoMeshes are Groups, we need to intersect their children (Mesh)
                // Actually raycaster can intersectObjects recursively
                const intersects = raycaster.intersectObjects(photoMeshes, true);

                if (intersects.length > 0) {
                    // Find the root group of the clicked object
                    let obj = intersects[0].object;
                    while(obj.parent && !photoMeshes.includes(obj)) {
                        obj = obj.parent;
                    }
                    
                    if (photoMeshes.includes(obj)) {
                        const index = obj.userData.id;
                        
                        // Toggle Focus
                        if (STATE.mode === 'FOCUS' && STATE.focusIndex === index) {
                            // If already focused on this one, go back to SCATTER (unfocus)
                            enterMode('SCATTER');
                        } else {
                            // Focus on this one
                            enterMode('FOCUS', index);
                        }
                    }
                } else {
                    // Clicked on empty space in SCATTER/FOCUS mode -> Go back to SCATTER
                    if (STATE.mode === 'FOCUS') {
                        enterMode('SCATTER');
                    }
                }
            }
        });

        const helpBtn = document.getElementById('help-btn');
        const panel = document.getElementById('instruction-panel');
        helpBtn.addEventListener('click', () => {
          panel.classList.toggle('visible');
        });
        
        // Webcam toggle
        const camToggle = document.getElementById('webcam-toggle');
        const camWrapper = document.getElementById('webcam-wrapper');
        let isCamVisible = true;
        
        camToggle.addEventListener('click', () => {
          isCamVisible = !isCamVisible;
          if(isCamVisible) {
            camWrapper.classList.remove('minimized');
            camToggle.textContent = '−';
          } else {
            camWrapper.classList.add('minimized');
            camToggle.textContent = '+';
          }
        });

        window.addEventListener('resize', () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
          composer.setSize(window.innerWidth, window.innerHeight);
        });
      }

      async function setupMediaPipe() {
        const video = document.getElementById("webcam");
        const canvas = document.getElementById("output_canvas");
        const ctx = canvas.getContext("2d");
        drawingUtils = new DrawingUtils(ctx);

        const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
        handLandmarker = await HandLandmarker.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath: `https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task`,
            delegate: "GPU",
          },
          runningMode: "VIDEO",
          numHands: 1,
        });
        if (navigator.mediaDevices?.getUserMedia) {
           try {
             const stream = await navigator.mediaDevices.getUserMedia({ video: true });
             video.srcObject = stream;
             video.addEventListener("loadeddata", predictLoop);
           } catch(e) { console.warn("Cam fail", e); }
        }
      }

      let lastVideoTime = -1;
      function predictLoop() {
        const video = document.getElementById("webcam");
        const canvas = document.getElementById("output_canvas");
        const ctx = canvas.getContext("2d");
        
        if (video.currentTime !== lastVideoTime && video.readyState >= 2) {
          lastVideoTime = video.currentTime;
          
          if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
             canvas.width = video.videoWidth;
             canvas.height = video.videoHeight;
          }

          if(handLandmarker) {
            const res = handLandmarker.detectForVideo(video, performance.now());
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (res.landmarks) {
              for (const landmarks of res.landmarks) {
                drawingUtils.drawConnectors(landmarks, HandLandmarker.HAND_CONNECTIONS, {
                  color: "#d4af37",
                  lineWidth: 3
                });
                drawingUtils.drawLandmarks(landmarks, {
                  color: "#ffffff",
                  lineWidth: 1,
                  radius: 3
                });
              }
            }
            
            handleGestures(res);
          }
        }
        requestAnimationFrame(predictLoop);
      }

      function handleGestures(result) {
        if(!result.landmarks || result.landmarks.length === 0) {
           STATE.hand.detected = false;
           return;
        }
        STATE.hand.detected = true;
        const lm = result.landmarks[0];
        
        const wrist = lm[0];
        const tips = [lm[8], lm[12], lm[16], lm[20]];
        let extended = 0;
        tips.forEach(t => {
           if(Math.hypot(t.x - wrist.x, t.y - wrist.y) > 0.15) extended++;
        });

        const thumb = lm[4];
        const index = lm[8];
        const pinchDist = Math.hypot(thumb.x - index.x, thumb.y - index.y);
        const currX = lm[9].x;

        // Interaction Logic
        if (pinchDist < 0.05) {
          // PINCH GESTURE: Trigger Focus Mode
          if (STATE.mode !== 'FOCUS' && STATE.mode === 'SCATTER') {
             // Find closest photo to camera
             let closestDist = Infinity;
             let closestIdx = -1;
             
             photoMeshes.forEach((mesh, i) => {
                 // Calculate World Position of the mesh
                 // Mesh is in photoGroup which might be rotated
                 const worldPos = new THREE.Vector3();
                 mesh.getWorldPosition(worldPos);
                 
                 // Distance to camera (Camera is at Z=65)
                 const dist = worldPos.distanceTo(camera.position);
                 
                 if(dist < closestDist) {
                     closestDist = dist;
                     closestIdx = i;
                 }
             });

             if (closestIdx !== -1) {
                STATE.focusIndex = closestIdx;
                enterMode('FOCUS');
             }
          }
        } else if (extended >= 4) {
          if (STATE.mode !== 'SCATTER') {
             enterMode('SCATTER');
          }
        } else if (extended <= 1) {
          if (STATE.mode !== 'TREE') {
             enterMode('TREE');
          }
        }
        
        STATE.hand.prevX = currX;
        STATE.hand.x = (lm[9].x - 0.5) * 2;
        STATE.hand.y = (lm[9].y - 0.5) * 2;
      }

      function enterMode(mode, idx = -1) {
        const prevMode = STATE.mode;
        STATE.mode = mode;
        STATE.focusIndex = idx; // Store focus index
        
        // Adjust frame brightness: Darker in Scatter/Nebula mode to reduce glare
        if (photoMeshes.length > 0) {
           const frameMat = photoMeshes[0].children[0].material;
           if (mode === 'TREE') {
               frameMat.color.setHex(0xfffaf0);
               frameMat.roughness = 0.4; // Restore roughness
           } else {
               frameMat.color.setHex(0xaaaaaa); // Medium grey (brighter than 0x666666 but darker than 0xcccccc)
               frameMat.roughness = 0.7; // Slightly less rough to allow some light play
           }
        }

        if (mode === 'TREE') {
          gsap.to(camera.position, { x:0, y:0, z: 60, duration: 2, ease: "power2.inOut" });
          // Reset Photo Group rotation to align with tree?
          gsap.to(photoGroup.rotation, { y: 0, duration: 1 });
        } else if (mode === 'SCATTER') {
          // Camera moves further back to accommodate larger ring (radius 35)
          gsap.to(camera.position, { x:0, y:0, z: 65, duration: 2.5, ease: "expo.out" }); 
          // Keep focus index if provided (e.g. from click), otherwise reset
          if (idx === -1) STATE.focusIndex = -1;
        } else if (mode === 'FOCUS') {
           // Do not change camera position, just let the photo come to us
        }
      }

      function animate() {
        requestAnimationFrame(animate);
        const dt = clock.getDelta();

        // Update matrices to ensure world transforms are current for calculations
        // This is crucial for correct Focus positioning relative to parent group rotations
        if (mainGroup) mainGroup.updateMatrixWorld(true);

        // Update Shooting Stars
        updateShootingStar(dt);

        // Parallax Camera & Drag
        if (STATE.mode !== 'FOCUS') {
           if (STATE.mode === 'TREE' && isDragging) {
              // Dragging overrides parallax
              // Camera stays at baseZ but we might want to let it drift slightly?
              // For now, disable parallax on camera when dragging tree to avoid motion sickness
              camera.lookAt(0,0,0);
           } else {
               // Smoothly move camera based on mouse
               // Base position depends on mode
               const baseZ = STATE.mode === 'SCATTER' ? 65 : 60;
               targetCameraPos.set(mouse.x * 2, mouse.y * 2, baseZ);
               camera.position.lerp(targetCameraPos, 0.05);
               camera.lookAt(0, 0, 0);
           }
        }

        // Global Rotation Logic
        if (STATE.mode === 'SCATTER') {
           // Automatic rotation: Left to Right (Positive Y rotation)
           photoGroup.rotation.y += STATE.scatterAutoSpeed * dt; 
           
        } else if (STATE.mode === 'FOCUS') {
           // Stop rotation when focused to inspect
           // photoGroup.rotation.y stays constant
           STATE.carouselVelocity = 0;
        } else {
           // Tree Mode
           if (!isDragging) {
               // Apply inertia
               if (Math.abs(dragVelocity.x) > 0.0001 || Math.abs(dragVelocity.y) > 0.0001) {
                   mainGroup.rotation.y += dragVelocity.x;
                   mainGroup.rotation.x += dragVelocity.y;
                   
                   dragVelocity.x *= 0.95; // Damping
                   dragVelocity.y *= 0.95; 
                   
                   // Check limits for X during inertia
                   mainGroup.rotation.x = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, mainGroup.rotation.x));
               } else {
                   // Fallback to auto-rotate if stopped AND reset X rotation
                   mainGroup.rotation.y += STATE.autoRotateSpeed * dt;
                   
                   // Smoothly reset X rotation to 0 (upright)
                   if (Math.abs(mainGroup.rotation.x) > 0.001) {
                       mainGroup.rotation.x = THREE.MathUtils.lerp(mainGroup.rotation.x, 0, 0.05);
                   } else {
                       mainGroup.rotation.x = 0;
                   }
               }
           }
           // Sync photo group
           photoGroup.rotation.y = 0; 
        }

        // Background rotate slowly
        backgroundGroup.rotation.y -= 0.02 * dt;

        const lerpFactor = 2.5 * dt; // Speed of transition

        // Tree Particles
        for(let i=0; i<CONFIG.tree.particleCount; i++) {
          const d = treeData[i];
          // Scatter mode: explode outwards
          const target = (STATE.mode === 'SCATTER' || STATE.mode === 'FOCUS') ? d.scatterPos : d.treePos;
          
          let targetPos = target.clone();

          // Add flow to currentPos for Tree Mode
          if (STATE.mode === 'TREE') {
              // ... existing tree mode logic ...
              // For simplicity, we just use the original lerp logic here but kept the structure
              // We previously decided to skip complex flow to keep shape clean
              // So we just lerp to target
          } else if (STATE.mode === 'SCATTER' || STATE.mode === 'FOCUS') {
             // Add Drift Animation in Nebula Mode
             // Use sine waves to create floating effect
             const time = clock.elapsedTime;
             const driftX = Math.sin(time * d.driftSpeed + d.driftOffset) * 2.0; // Amplitude 2.0
             const driftY = Math.cos(time * d.driftSpeed * 0.8 + d.driftOffset) * 2.0;
             const driftZ = Math.sin(time * d.driftSpeed * 0.5 + d.driftOffset) * 2.0;
             
             targetPos.add(new THREE.Vector3(driftX, driftY, driftZ));
          }

          d.currentPos.lerp(targetPos, lerpFactor);

          dummy.position.copy(d.currentPos);
          dummy.rotation.copy(d.rot);
          let s = d.scale;
          if(STATE.mode === 'TREE') {
             // Enhanced Sparkle: Sharp sine wave
             // Math.sin(...)^10 creates sharp peaks (twinkles)
             const sparkle = Math.pow(Math.sin(clock.elapsedTime * 3 + i * 0.1), 10); 
             s *= (0.6 + 0.6 * sparkle); 
          }
          dummy.scale.setScalar(s);
          dummy.updateMatrix();
          treeMesh.setMatrixAt(i, dummy.matrix);
        }
        treeMesh.instanceMatrix.needsUpdate = true;

        // Ornaments
        for(let i=0; i<CONFIG.ribbon.sphereCount; i++) {
          const d = ornamentData[i];
          const target = (STATE.mode === 'SCATTER' || STATE.mode === 'FOCUS') ? d.scatterPos : d.treePos;
          
          let targetPos = target.clone();

          if (STATE.mode === 'SCATTER' || STATE.mode === 'FOCUS') {
             // Add Drift Animation for Ornaments
             const time = clock.elapsedTime;
             // Slightly slower/different drift for ornaments
             const driftX = Math.sin(time * d.driftSpeed + d.driftOffset) * 3.0; 
             const driftY = Math.cos(time * d.driftSpeed * 0.9 + d.driftOffset) * 3.0;
             const driftZ = Math.sin(time * d.driftSpeed * 0.6 + d.driftOffset) * 3.0;
             
             targetPos.add(new THREE.Vector3(driftX, driftY, driftZ));
          }

          d.currentPos.lerp(targetPos, lerpFactor);
          dummy.position.copy(d.currentPos);
          dummy.scale.setScalar(d.scale);
          dummy.updateMatrix();
          ornamentMesh.setMatrixAt(i, dummy.matrix);
        }
        ornamentMesh.instanceMatrix.needsUpdate = true;

        // Photos Logic
        photoMeshes.forEach((mesh, idx) => {
          const d = mesh.userData;
          
          // Determine Position
          let targetPos = new THREE.Vector3();
          let targetRot = new THREE.Euler();
          let targetScale = 1.0;

          if (STATE.mode === 'TREE') {
             targetPos.copy(d.treePos);
             targetRot.copy(d.treeRot);
             targetScale = 0.6; // Smaller scale for tree mode
          } else {
             // Scatter & Focus use ScatterPos (Ring)
             targetPos.copy(d.scatterPos);
             targetRot.copy(d.scatterRot);
             targetScale = 1.8; // Larger scale for scatter mode to look like reference
             
             // Add Drift for Photos in Nebula Mode (but NOT if this specific photo is focused)
             if (STATE.mode === 'SCATTER' || (STATE.mode === 'FOCUS' && STATE.focusIndex !== idx)) {
                 const time = clock.elapsedTime;
                 const driftY = Math.sin(time * d.driftSpeed + d.driftOffset) * 1.5; // Vertical drift
                 targetPos.y += driftY;
                 
                 // Subtle rotation drift
                 targetRot.z += Math.sin(time * d.driftSpeed * 0.5) * 0.05; // Slight tilt
             }
          }

          // Special override for FOCUS mode
          if (STATE.mode === 'FOCUS' && idx === STATE.focusIndex) {
             // 1. Calculate Target World Position (In front of Camera)
             // Camera is typically at Z=65 in Scatter mode.
             // We want the photo to be comfortably in front, say 12 units away.
             const distInFront = 12;
             const targetWorldPos = new THREE.Vector3(0, 0, camera.position.z - distInFront); 

             // 2. Convert World Position to Local Position inside photoGroup
             // We use the inverse of the parent's world matrix to transform the world point to local space.
             // This accounts for both mainGroup and photoGroup rotations/transforms simultaneously.
             const parentWorldInverse = photoGroup.matrixWorld.clone().invert();
             const targetLocalPos = targetWorldPos.applyMatrix4(parentWorldInverse);

             // 3. Apply
             targetScale = 2.2; // FULL SCREEN SCALE
             
             mesh.position.lerp(targetLocalPos, lerpFactor);
             mesh.scale.lerp(new THREE.Vector3(targetScale, targetScale, targetScale), lerpFactor);
             
             // 4. Force LookAt Camera
             mesh.lookAt(camera.position);

          } else {
             // Normal behavior
             mesh.position.lerp(targetPos, lerpFactor);
             
             // Smooth rotation transition
             mesh.rotation.x += (targetRot.x - mesh.rotation.x) * lerpFactor;
             mesh.rotation.y += (targetRot.y - mesh.rotation.y) * lerpFactor;
             mesh.rotation.z += (targetRot.z - mesh.rotation.z) * lerpFactor;
             
             mesh.scale.lerp(new THREE.Vector3(targetScale, targetScale, targetScale), lerpFactor);
          }
        });

        // Snow (Foreground)
        if(snowPoints) {
           const positions = snowPoints.geometry.attributes.position.array;
           const vels = snowPoints.geometry.userData.velocities;
           for(let i=0; i<CONFIG.snow.count; i++) {
             positions[i*3] += vels[i*3];     
             positions[i*3+1] += vels[i*3+1]; 
             positions[i*3+2] += vels[i*3+2]; 
             if(positions[i*3+1] < -CONFIG.snow.range/2) {
                positions[i*3+1] = CONFIG.snow.range/2;
             }
           }
           snowPoints.geometry.attributes.position.needsUpdate = true;
           snowPoints.rotation.y = -mainGroup.rotation.y * 0.5; 
        }

        // Background Snow
        if(bgSnowPoints) {
           const positions = bgSnowPoints.geometry.attributes.position.array;
           const vels = bgSnowPoints.geometry.userData.velocities;
           const count = positions.length / 3;
           const range = 120;
           for(let i=0; i<count; i++) {
             positions[i*3] += vels[i*3];     
             positions[i*3+1] += vels[i*3+1]; 
             positions[i*3+2] += vels[i*3+2]; 
             if(positions[i*3+1] < -range/2) {
                positions[i*3+1] = range/2;
             }
           }
           bgSnowPoints.geometry.attributes.position.needsUpdate = true;
           bgSnowPoints.rotation.y = -mainGroup.rotation.y * 0.2; 
        }

        // Big Snow
        if(bigSnowPoints) {
           const positions = bigSnowPoints.geometry.attributes.position.array;
           const vels = bigSnowPoints.geometry.userData.velocities;
           const count = positions.length / 3;
           const range = 100;
           for(let i=0; i<count; i++) {
             positions[i*3] += vels[i*3];     
             positions[i*3+1] += vels[i*3+1]; 
             positions[i*3+2] += vels[i*3+2]; 
             if(positions[i*3+1] < -range/2) {
                positions[i*3+1] = range/2;
             }
           }
           bigSnowPoints.geometry.attributes.position.needsUpdate = true;
           bigSnowPoints.rotation.y = -mainGroup.rotation.y * 0.1;
           bigSnowPoints.rotation.x = Math.sin(clock.elapsedTime * 0.1) * 0.1;
        }

        // Real Snow
        if(realSnowMesh) {
            for(let i=0; i<realSnowData.length; i++) {
               const d = realSnowData[i];
               d.pos.add(d.vel);
               if(d.pos.y < -40) d.pos.y = 40;
               if(d.pos.x > 40) d.pos.x = -40;
               if(d.pos.x < -40) d.pos.x = 40;
               
               d.rot.x += d.rotVel.x;
               d.rot.y += d.rotVel.y;
               d.rot.z += d.rotVel.z;
               
               dummy.position.copy(d.pos);
               dummy.rotation.copy(d.rot);
               dummy.updateMatrix();
               realSnowMesh.setMatrixAt(i, dummy.matrix);
            }
            realSnowMesh.instanceMatrix.needsUpdate = true;
        }

        composer.render();
      }

      init();
    </script>
  </body>
</html>
