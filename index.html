<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Merry Christmas</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Noto+Serif+SC:wght@400;700&family=Quicksand:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #000000;
        font-family: "Quicksand", "Noto Serif SC", sans-serif;
      }
      #canvas-container {
        width: 100vw;
        height: 100vh;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 1;
        /* Lighter center for better contrast */
        background: radial-gradient(circle at center, #11221c 0%, #000000 90%);
      }

      /* UI Overlay */
      #ui-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 10;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        /* Adjusted top padding to balance layout */
        padding-top: 4vh; 
        box-sizing: border-box;
      }

      /* Loading */
      #loader {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #000;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: opacity 0.8s ease-out;
      }
      .loader-text {
        color: #d4af37;
        font-family: "Cinzel", serif;
        font-size: 24px;
        margin-top: 20px;
        letter-spacing: 4px;
        text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 2px solid rgba(212, 175, 55, 0.2);
        border-top: 2px solid #d4af37;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      /* Typography */
      h1 {
        font-family: "Cinzel", serif;
        color: #fceea7;
        font-size: clamp(32px, 6vw, 70px); /* Slightly smaller max size */
        margin: 0;
        font-weight: 400;
        letter-spacing: 2px;
        text-shadow: 0 0 20px rgba(252, 238, 167, 0.4);
        background: linear-gradient(to bottom, #fff 0%, #eebb66 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        z-index: 20;
        pointer-events: auto;
      }

      /* Webcam & Skeleton */
      #webcam-wrapper {
        position: absolute;
        bottom: 30px;
        right: 30px;
        width: 180px; /* Reduced size */
        height: 135px; /* 4:3 Aspect Ratio */
        z-index: 30;
        pointer-events: auto;
        transition: height 0.3s ease;
      }
      
      #webcam-wrapper.minimized {
        height: 30px;
        width: 30px;
        overflow: visible;
      }

      /* Container for the mirrored content */
      #webcam-content {
        width: 100%;
        height: 100%;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid rgba(212, 175, 55, 0.5);
        background: #000;
        box-shadow: 0 0 20px rgba(0,0,0,0.5);
        transform: scaleX(-1); /* Mirror effect only on content */
        transition: opacity 0.3s ease;
      }
      
      #webcam-wrapper.minimized #webcam-content {
        opacity: 0;
        pointer-events: none;
      }

      #webcam {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      #output_canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }

      /* Toggle Button */
      #webcam-toggle {
        position: absolute;
        top: -12px;
        right: -12px;
        width: 24px;
        height: 24px;
        background: #d4af37;
        color: #000;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 14px;
        font-weight: bold;
        z-index: 40;
        box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        border: 2px solid #000;
        transition: transform 0.2s;
      }
      #webcam-toggle:hover {
        transform: scale(1.1);
      }

      /* Instructions */
      .help-btn {
        position: absolute;
        bottom: 40px;
        left: 40px;
        background: rgba(0, 0, 0, 0.6);
        border: 1px solid rgba(212, 175, 55, 0.4);
        color: #d4af37;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 20px;
        transition: all 0.3s;
        pointer-events: auto;
        z-index: 20;
        font-family: "Cinzel", serif;
        box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      }
      .help-btn:hover {
        background: rgba(212, 175, 55, 0.2);
        color: #fff;
        box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
      }

      .instruction-panel {
        position: absolute;
        bottom: 100px;
        left: 40px;
        width: 300px;
        background: rgba(8, 8, 8, 0.95);
        border: 1px solid rgba(212, 175, 55, 0.3);
        padding: 24px;
        border-radius: 16px;
        pointer-events: none;
        opacity: 0;
        transform: translateY(20px);
        transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        z-index: 20;
        box-shadow: 0 10px 40px rgba(0,0,0,0.6);
      }
      .instruction-panel.visible {
        opacity: 1;
        transform: translateY(0);
      }
      .instruction-header {
        color: #fceea7;
        font-size: 14px;
        margin-bottom: 20px;
        border-bottom: 1px solid rgba(212, 175, 55, 0.15);
        padding-bottom: 12px;
        letter-spacing: 3px;
        font-weight: 700;
        font-family: "Quicksand", sans-serif;
        text-transform: uppercase;
      }
      .instruction-item {
        display: flex;
        align-items: flex-start;
        margin-bottom: 20px;
        color: #fceea7;
      }
      .instruction-item:last-child {
        margin-bottom: 0;
      }
      .icon { 
        font-size: 20px; 
        margin-right: 15px; 
        min-width: 24px;
        text-align: center;
        color: #ffdb58;
      }
      .content {
        display: flex;
        flex-direction: column;
      }
      .title {
        font-family: "Quicksand", sans-serif;
        font-weight: 700;
        font-size: 15px;
        color: #fffaf0;
        margin-bottom: 4px;
      }
      .desc { 
        font-size: 13px; 
        line-height: 1.6; 
        color: #b0b0b0; 
        font-family: "Noto Serif SC", serif;
      }
    </style>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
          "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/+esm",
          "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.12.5/index.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="loader">
      <div class="spinner"></div>
      <div class="loader-text">Loading Magic...</div>
    </div>

    <div id="canvas-container"></div>

    <div id="ui-layer">
      <h1>Merry Christmas</h1>

      <!-- Instruction Panel -->
      <div class="instruction-panel visible" id="instruction-panel">
        <div class="instruction-header">Gestures</div>
        
        <div class="instruction-item">
          <div class="icon">✊</div>
          <div class="content">
            <div class="title">Tree Mode</div>
            <div class="desc">握紧拳头，让粒子汇聚成旋转的圣诞树。</div>
          </div>
        </div>

        <div class="instruction-item">
          <div class="icon">🖐️</div>
          <div class="content">
            <div class="title">Scatter Mode</div>
            <div class="desc">张开手掌，粒子炸裂。移动手掌旋转视角，靠近镜头缩放。</div>
          </div>
        </div>

        <div class="instruction-item">
          <div class="icon">👌</div>
          <div class="content">
            <div class="title">Focus Photo</div>
            <div class="desc">拇指食指捏合，抓取并放大查看照片。</div>
          </div>
        </div>

        <div class="instruction-item">
          <div class="icon">👋</div>
          <div class="content">
            <div class="title">Navigate</div>
            <div class="desc">在聚焦模式下，左右挥手即可切换照片。</div>
          </div>
        </div>
      </div>
      
      <div class="help-btn" id="help-btn">?</div>
    </div>

    <div id="webcam-wrapper">
      <div id="webcam-toggle">−</div>
      <div id="webcam-content">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="output_canvas"></canvas>
      </div>
    </div>

    <script type="module">
      import * as THREE from "three";
      import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
      import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
      import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
      import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
      import { FilesetResolver, HandLandmarker, DrawingUtils } from "@mediapipe/tasks-vision";
      import gsap from "gsap";

      // --- CONFIGURATION ---
      const CONFIG = {
        tree: {
          height: 32,
          radius: 11,
          particleCount: 3000, 
        },
        ribbon: {
          turns: 5.5,
          sphereCount: 200, 
          radiusOffset: 0.9,
        },
        snow: {
          count: 600, 
          range: 90
        },
        colors: {
          vintageGold: 0xF5D059, 
          wineRed: 0xFF1F37,     
          greyBlue: 0x8D96BB,    
          rosePink: 0xFF8E99,    
          champagne: 0xFFF7DE,
          
          treeGreen: 0x4caf50, 
          star: 0xffeebb
        }
      };

      const STATE = {
        mode: "TREE", 
        focusIndex: -1,
        lastSwipeTime: 0,
        hand: {
          detected: false,
          x: 0, y: 0, prevX: 0
        },
        autoRotateSpeed: 0.15
      };

      // Globals
      let scene, camera, renderer, composer;
      let clock = new THREE.Clock();
      let mainGroup, photoGroup, backgroundGroup;
      
      // Meshes
      let treeMesh, ornamentMesh;
      let snowPoints, bgStars, bgSnowPoints, bigSnowPoints;
      // New real snow variables
      let realSnowMesh, realSnowData = [];

      let dummy = new THREE.Object3D();
      let colorDummy = new THREE.Color();

      // Data Arrays
      let treeData = []; 
      let ornamentData = []; 
      
      let photoMeshes = [];
      let handLandmarker = null;
      let drawingUtils = null;

      async function init() {
        setupThree();
        createBackgroundStars();
        createBackgroundSnow(); // Mid-layer background snow
        createBigSnow(); // Large bokeh snow
        createRealSnow(); // New Realistic Snowflakes
        createSnow(); // Foreground snow
        createTree();
        createOrnaments();
        createTopStar();
        
        setupPostProcessing();
        setupInput();
        await setupMediaPipe();

        gsap.to("#loader", { opacity: 0, duration: 1, onComplete: () => document.getElementById("loader").remove() });
        
        animate();
      }

      function setupThree() {
        const container = document.getElementById("canvas-container");
        scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x111111, 0.006); 

        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 60);

        renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.8; 
        renderer.shadowMap.enabled = true; 
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        mainGroup = new THREE.Group();
        // Shift entire group to a balanced position
        mainGroup.position.y = -1.5; 
        scene.add(mainGroup);
        
        photoGroup = new THREE.Group();
        mainGroup.add(photoGroup);
        backgroundGroup = new THREE.Group();
        scene.add(backgroundGroup);

        // --- Lighting ---
        
        const ambient = new THREE.AmbientLight(0xffffff, 1.5);
        scene.add(ambient);

        // Hemisphere light for better overall fill
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x080820, 1.0);
        scene.add(hemiLight);
        
        const spot = new THREE.SpotLight(0xffeebb, 2500);
        spot.position.set(10, 50, 20);
        spot.angle = 0.5;
        spot.penumbra = 0.5;
        spot.castShadow = true;
        spot.shadow.bias = -0.0001;
        spot.shadow.mapSize.width = 2048;
        spot.shadow.mapSize.height = 2048;
        scene.add(spot);

        const dirLight = new THREE.DirectionalLight(0xffffff, 4.0);
        dirLight.position.set(-10, 10, 50);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        scene.add(dirLight);

        const bottomLight = new THREE.PointLight(CONFIG.colors.champagne, 8, 60);
        bottomLight.position.set(0, -15, 10);
        scene.add(bottomLight);
      }

      function generateSnowflakeTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 128;
        canvas.height = 128;
        const ctx = canvas.getContext('2d');
        
        ctx.fillStyle = '#00000000'; 
        ctx.clearRect(0,0,128,128);
        
        ctx.translate(64, 64);
        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.shadowColor = 'rgba(255,255,255,0.8)';
        ctx.shadowBlur = 4;

        for(let i=0; i<6; i++) {
            ctx.save();
            ctx.rotate(i * Math.PI / 3);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(0, -48);
            ctx.stroke();
            
            // Branch 1
            ctx.beginPath();
            ctx.moveTo(0, -15);
            ctx.lineTo(-12, -28);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(0, -15);
            ctx.lineTo(12, -28);
            ctx.stroke();

            // Branch 2
            ctx.beginPath();
            ctx.moveTo(0, -30);
            ctx.lineTo(-10, -40);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(0, -30);
            ctx.lineTo(10, -40);
            ctx.stroke();
            
            ctx.restore();
        }
        
        const tex = new THREE.CanvasTexture(canvas);
        tex.needsUpdate = true;
        return tex;
      }

      function createRealSnow() {
        const tex = generateSnowflakeTexture();
        const geo = new THREE.PlaneGeometry(1.5, 1.5);
        const mat = new THREE.MeshBasicMaterial({
          map: tex,
          transparent: true,
          opacity: 0.95,
          side: THREE.DoubleSide,
          depthWrite: false,
          blending: THREE.AdditiveBlending
        });
        
        const count = 50;
        realSnowMesh = new THREE.InstancedMesh(geo, mat, count);
        scene.add(realSnowMesh);

        for(let i=0; i<count; i++) {
           realSnowData.push({
             pos: new THREE.Vector3(
               (Math.random()-0.5) * 80,
               (Math.random()-0.5) * 80,
               (Math.random()-0.5) * 80
             ),
             vel: new THREE.Vector3(
               (Math.random()-0.5) * 0.05,
               -(Math.random() * 0.08 + 0.04),
               (Math.random()-0.5) * 0.05
             ),
             rot: new THREE.Euler(Math.random()*Math.PI, Math.random()*Math.PI, 0),
             rotVel: new THREE.Vector3(
                Math.random()*0.02, Math.random()*0.02, Math.random()*0.02
             )
           });
           
           dummy.position.copy(realSnowData[i].pos);
           dummy.rotation.copy(realSnowData[i].rot);
           dummy.updateMatrix();
           realSnowMesh.setMatrixAt(i, dummy.matrix);
        }
      }

      function createBackgroundStars() {
        const geo = new THREE.BufferGeometry();
        const pos = [];
        for(let i=0; i<800; i++) { 
          const r = 100 + Math.random() * 100;
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.acos(2 * Math.random() - 1);
          pos.push(
            r * Math.sin(phi) * Math.cos(theta),
            r * Math.sin(phi) * Math.sin(theta),
            r * Math.cos(phi)
          );
        }
        geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
        const mat = new THREE.PointsMaterial({
          color: 0x88aabb,
          size: 0.6, 
          transparent: true,
          opacity: 0.8 
        });
        bgStars = new THREE.Points(geo, mat);
        backgroundGroup.add(bgStars);
      }

      function createBackgroundSnow() {
        const geo = new THREE.BufferGeometry();
        const pos = [];
        const vels = [];
        const count = 400; 
        const range = 120;
        
        for(let i=0; i<count; i++) {
          pos.push(
            (Math.random()-0.5) * range,
            (Math.random()-0.5) * range + 20, 
            (Math.random()-0.5) * range - 20 
          );
          vels.push(
            (Math.random()-0.5) * 0.05, 
            -(Math.random() * 0.05 + 0.02), 
            (Math.random()-0.5) * 0.05
          );
        }
        geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
        geo.userData = { velocities: vels };

        const canvas = document.createElement('canvas');
        canvas.width = 32; canvas.height = 32;
        const ctx = canvas.getContext('2d');
        const grad = ctx.createRadialGradient(16,16,0,16,16,16);
        grad.addColorStop(0, 'rgba(255,255,255,0.6)');
        grad.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0,0,32,32);
        const tex = new THREE.CanvasTexture(canvas);

        const mat = new THREE.PointsMaterial({
          color: 0xffffff,
          size: 1.5, 
          map: tex,
          transparent: true,
          opacity: 0.6, 
          depthWrite: false,
          blending: THREE.AdditiveBlending
        });

        bgSnowPoints = new THREE.Points(geo, mat);
        scene.add(bgSnowPoints);
      }

      function createBigSnow() {
        const geo = new THREE.BufferGeometry();
        const pos = [];
        const vels = [];
        const count = 100; 
        const range = 100;
        
        for(let i=0; i<count; i++) {
          pos.push(
            (Math.random()-0.5) * range,
            (Math.random()-0.5) * range + 10, 
            (Math.random()-0.5) * range - 10 
          );
          vels.push(
            (Math.random()-0.5) * 0.02, 
            -(Math.random() * 0.03 + 0.01), 
            (Math.random()-0.5) * 0.02
          );
        }
        geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
        geo.userData = { velocities: vels };

        // Soft, large texture
        const canvas = document.createElement('canvas');
        canvas.width = 64; canvas.height = 64;
        const ctx = canvas.getContext('2d');
        const grad = ctx.createRadialGradient(32,32,0,32,32,32);
        grad.addColorStop(0, 'rgba(255,255,255,0.4)');
        grad.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0,0,64,64);
        const tex = new THREE.CanvasTexture(canvas);

        const mat = new THREE.PointsMaterial({
          color: 0xffffff,
          size: 4.0, 
          map: tex,
          transparent: true,
          opacity: 0.4,
          depthWrite: false,
          blending: THREE.NormalBlending
        });

        bigSnowPoints = new THREE.Points(geo, mat);
        scene.add(bigSnowPoints);
      }

      function createSnow() {
        const geo = new THREE.BufferGeometry();
        const pos = [];
        const vels = [];
        
        for(let i=0; i<CONFIG.snow.count; i++) {
          pos.push(
            (Math.random()-0.5) * CONFIG.snow.range,
            (Math.random()-0.5) * CONFIG.snow.range,
            (Math.random()-0.5) * CONFIG.snow.range
          );
          vels.push(
            (Math.random()-0.5) * 0.1, 
            -(Math.random() * 0.15 + 0.05), 
            (Math.random()-0.5) * 0.1 
          );
        }
        geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
        geo.userData = { velocities: vels };

        const canvas = document.createElement('canvas');
        canvas.width = 32; canvas.height = 32;
        const ctx = canvas.getContext('2d');
        const grad = ctx.createRadialGradient(16,16,0,16,16,16);
        grad.addColorStop(0, 'rgba(255,255,255,1)');
        grad.addColorStop(0.4, 'rgba(255,255,255,0.8)');
        grad.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0,0,32,32);
        const tex = new THREE.CanvasTexture(canvas);

        const mat = new THREE.PointsMaterial({
          color: 0xffffff,
          size: 0.5,
          map: tex,
          transparent: true,
          opacity: 0.9,
          depthWrite: false,
          blending: THREE.AdditiveBlending
        });

        snowPoints = new THREE.Points(geo, mat);
        scene.add(snowPoints);
      }

      function createTree() {
        const geo = new THREE.TetrahedronGeometry(0.15, 0);
        const mat = new THREE.MeshStandardMaterial({ 
          color: CONFIG.colors.treeGreen, 
          roughness: 0.4, 
          metalness: 0.1,
          emissive: 0x003300, 
          emissiveIntensity: 0.3
        });
        
        treeMesh = new THREE.InstancedMesh(geo, mat, CONFIG.tree.particleCount);
        treeMesh.castShadow = true;
        treeMesh.receiveShadow = true;
        treeMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        mainGroup.add(treeMesh);

        const baseColor = new THREE.Color(CONFIG.colors.treeGreen);

        for(let i=0; i<CONFIG.tree.particleCount; i++) {
          const yNorm = Math.pow(Math.random(), 0.9); 
          const y = (1 - yNorm) * CONFIG.tree.height - (CONFIG.tree.height/2);
          const rMax = yNorm * CONFIG.tree.radius;
          const r = Math.sqrt(Math.random()) * rMax; 
          const theta = Math.random() * Math.PI * 2;
          
          const x = Math.cos(theta) * r;
          const z = Math.sin(theta) * r;

          const sr = 30 + Math.random() * 40;
          const sTheta = Math.random() * Math.PI * 2;
          const sPhi = Math.acos(2 * Math.random() - 1);
          
          treeData.push({
            treePos: new THREE.Vector3(x, y, z),
            scatterPos: new THREE.Vector3(
              sr * Math.sin(sPhi) * Math.cos(sTheta),
              sr * Math.sin(sPhi) * Math.sin(sTheta),
              sr * Math.cos(sPhi)
            ),
            currentPos: new THREE.Vector3(x, y, z),
            rot: new THREE.Euler(Math.random()*6, Math.random()*6, 0),
            scale: 0.5 + Math.random()
          });

          dummy.position.set(x, y, z);
          dummy.rotation.copy(treeData[i].rot);
          dummy.scale.setScalar(treeData[i].scale);
          dummy.updateMatrix();
          treeMesh.setMatrixAt(i, dummy.matrix);

          const col = baseColor.clone();
          col.offsetHSL(0, 0, (Math.random()-0.5)*0.15); 
          treeMesh.setColorAt(i, col);
        }
      }

      function createOrnaments() {
        const geo = new THREE.SphereGeometry(0.5, 32, 32);
        // Optimized PBR material: Brighter base, higher emissive
        const mat = new THREE.MeshPhysicalMaterial({ 
          color: 0xffffff, 
          roughness: 0.2, // Slightly rougher to catch more diffuse light
          metalness: 0.6, // Reduced metalness so it's not too dark (pure metal reflects black void) 
          clearcoat: 1.0,
          clearcoatRoughness: 0.1,
          reflectivity: 1.0,
          iridescence: 0.5,
          emissive: 0x555555, // Strong white-ish emissive base to brighten all colors
          emissiveIntensity: 0.6 // Increased intensity
        });

        ornamentMesh = new THREE.InstancedMesh(geo, mat, CONFIG.ribbon.sphereCount);
        ornamentMesh.castShadow = true;
        ornamentMesh.receiveShadow = true;
        ornamentMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        mainGroup.add(ornamentMesh);

        const palette = [
          CONFIG.colors.vintageGold,
          CONFIG.colors.wineRed,
          CONFIG.colors.greyBlue,
          CONFIG.colors.rosePink,
          CONFIG.colors.champagne
        ];

        for(let i=0; i<CONFIG.ribbon.sphereCount; i++) {
          const t = i / CONFIG.ribbon.sphereCount; 
          const h = CONFIG.tree.height;
          const y = (1 - t) * h - (h/2);
          const r = (t * CONFIG.tree.radius) + CONFIG.ribbon.radiusOffset;
          const theta = t * Math.PI * 2 * CONFIG.ribbon.turns;
          
          const x = Math.cos(theta) * r;
          const z = Math.sin(theta) * r;

          const sr = 40 + Math.random() * 20;
          const sx = (Math.random()-0.5)*sr*2;
          const sy = (Math.random()-0.5)*sr*2;
          const sz = (Math.random()-0.5)*sr*2;

          ornamentData.push({
            treePos: new THREE.Vector3(x, y, z),
            scatterPos: new THREE.Vector3(sx, sy, sz),
            currentPos: new THREE.Vector3(x, y, z),
            scale: 0.8 + Math.random() * 0.4
          });

          const colorHex = palette[Math.floor(Math.random() * palette.length)];
          colorDummy.setHex(colorHex);
          ornamentMesh.setColorAt(i, colorDummy);

          dummy.position.set(x, y, z);
          dummy.scale.setScalar(ornamentData[i].scale);
          dummy.updateMatrix();
          ornamentMesh.setMatrixAt(i, dummy.matrix);
        }
      }

      function createTopStar() {
        const geo = new THREE.OctahedronGeometry(1.8, 0);
        const mat = new THREE.MeshStandardMaterial({ 
          color: CONFIG.colors.star, 
          emissive: 0xffaa00,
          emissiveIntensity: 2.5,
          roughness: 0.2,
          metalness: 0.8
        });
        const star = new THREE.Mesh(geo, mat);
        star.castShadow = true;
        star.position.set(0, CONFIG.tree.height/2 + 1.5, 0);
        
        const light = new THREE.PointLight(CONFIG.colors.star, 8, 30);
        star.add(light);
        
        mainGroup.add(star);
        gsap.to(star.scale, { x: 1.15, y: 1.15, z: 1.15, duration: 2, yoyo: true, repeat: -1, ease: "sine.inOut" });
        gsap.to(star.rotation, { y: Math.PI*2, duration: 8, ease: "none", repeat: -1 });
      }

      function setupPostProcessing() {
        const renderPass = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(
          new THREE.Vector2(window.innerWidth, window.innerHeight),
          1.5, 0.4, 0.85
        );
        bloomPass.threshold = 0.65;
        bloomPass.strength = 0.5;
        bloomPass.radius = 0.8;
        
        const outputPass = new OutputPass();

        composer = new EffectComposer(renderer);
        composer.addPass(renderPass);
        composer.addPass(bloomPass);
        composer.addPass(outputPass);
      }

      function setupInput() {
        const helpBtn = document.getElementById('help-btn');
        const panel = document.getElementById('instruction-panel');
        helpBtn.addEventListener('click', () => {
          panel.classList.toggle('visible');
        });
        
        // Webcam toggle
        const camToggle = document.getElementById('webcam-toggle');
        const camWrapper = document.getElementById('webcam-wrapper');
        let isCamVisible = true;
        
        camToggle.addEventListener('click', () => {
          isCamVisible = !isCamVisible;
          if(isCamVisible) {
            camWrapper.classList.remove('minimized');
            camToggle.textContent = '−';
          } else {
            camWrapper.classList.add('minimized');
            camToggle.textContent = '+';
          }
        });

        window.addEventListener('resize', () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
          composer.setSize(window.innerWidth, window.innerHeight);
        });
      }

      async function setupMediaPipe() {
        const video = document.getElementById("webcam");
        const canvas = document.getElementById("output_canvas");
        const ctx = canvas.getContext("2d");
        drawingUtils = new DrawingUtils(ctx);

        const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
        handLandmarker = await HandLandmarker.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath: `https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task`,
            delegate: "GPU",
          },
          runningMode: "VIDEO",
          numHands: 1,
        });
        if (navigator.mediaDevices?.getUserMedia) {
           try {
             const stream = await navigator.mediaDevices.getUserMedia({ video: true });
             video.srcObject = stream;
             video.addEventListener("loadeddata", predictLoop);
           } catch(e) { console.warn("Cam fail", e); }
        }
      }

      let lastVideoTime = -1;
      function predictLoop() {
        const video = document.getElementById("webcam");
        const canvas = document.getElementById("output_canvas");
        const ctx = canvas.getContext("2d");
        
        if (video.currentTime !== lastVideoTime && video.readyState >= 2) {
          lastVideoTime = video.currentTime;
          
          if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
             canvas.width = video.videoWidth;
             canvas.height = video.videoHeight;
          }

          if(handLandmarker) {
            const res = handLandmarker.detectForVideo(video, performance.now());
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (res.landmarks) {
              for (const landmarks of res.landmarks) {
                drawingUtils.drawConnectors(landmarks, HandLandmarker.HAND_CONNECTIONS, {
                  color: "#d4af37",
                  lineWidth: 3
                });
                drawingUtils.drawLandmarks(landmarks, {
                  color: "#ffffff",
                  lineWidth: 1,
                  radius: 3
                });
              }
            }
            
            handleGestures(res);
          }
        }
        requestAnimationFrame(predictLoop);
      }

      function handleGestures(result) {
        if(!result.landmarks || result.landmarks.length === 0) {
           STATE.hand.detected = false;
           return;
        }
        STATE.hand.detected = true;
        const lm = result.landmarks[0];
        
        const wrist = lm[0];
        const tips = [lm[8], lm[12], lm[16], lm[20]];
        let extended = 0;
        tips.forEach(t => {
           if(Math.hypot(t.x - wrist.x, t.y - wrist.y) > 0.15) extended++;
        });

        const thumb = lm[4];
        const index = lm[8];
        const pinchDist = Math.hypot(thumb.x - index.x, thumb.y - index.y);

        if (pinchDist < 0.05) {
          if (STATE.mode !== 'FOCUS') enterMode('FOCUS');
          const currX = lm[9].x;
          const diff = currX - STATE.hand.prevX;
          if (Math.abs(diff) > 0.03 && performance.now() - STATE.lastSwipeTime > 500) {
            navigatePhotos(diff > 0 ? 1 : -1);
            STATE.lastSwipeTime = performance.now();
          }
          STATE.hand.prevX = currX;
        } else if (extended >= 4) {
          if (STATE.mode !== 'SCATTER') enterMode('SCATTER');
        } else if (extended <= 1) {
          if (STATE.mode !== 'TREE') enterMode('TREE');
        }

        STATE.hand.x = (lm[9].x - 0.5) * 2;
        STATE.hand.y = (lm[9].y - 0.5) * 2;
      }

      function enterMode(mode) {
        STATE.mode = mode;
        if (mode === 'TREE') {
          gsap.to(camera.position, { z: 60, duration: 1.5, ease: "power2.out" });
        } else if (mode === 'SCATTER') {
          gsap.to(camera.position, { z: 50, duration: 1.5, ease: "power2.out" });
        } else if (mode === 'FOCUS') {
          if (photoMeshes.length > 0 && STATE.focusIndex === -1) STATE.focusIndex = 0;
          gsap.to(camera.position, { z: 40, duration: 1.5, ease: "power2.out" });
        }
      }

      function navigatePhotos(dir) {
        if(photoMeshes.length === 0) return;
        let idx = STATE.focusIndex + dir;
        if(idx >= photoMeshes.length) idx = 0;
        if(idx < 0) idx = photoMeshes.length - 1;
        STATE.focusIndex = idx;
      }

      function addPhoto(texture) {
        const t = 0.15 + Math.random() * 0.7; 
        const h = CONFIG.tree.height;
        const y = (1 - t) * h - (h/2);
        const r = (t * CONFIG.tree.radius) + CONFIG.ribbon.radiusOffset + 1.2; 
        const theta = t * Math.PI * 2 * CONFIG.ribbon.turns + (Math.random() * 0.5);

        const x = Math.cos(theta) * r;
        const z = Math.sin(theta) * r;

        const group = new THREE.Group();
        
        // Frame
        const frame = new THREE.Mesh(
          new THREE.BoxGeometry(3.2, 4.2, 0.1),
          new THREE.MeshStandardMaterial({ color: CONFIG.colors.vintageGold, roughness: 0.3, metalness: 0.9 })
        );
        frame.castShadow = true;
        frame.receiveShadow = true;

        const plane = new THREE.Mesh(
          new THREE.PlaneGeometry(2.8, 2.8),
          new THREE.MeshBasicMaterial({ map: texture })
        );
        plane.position.set(0, 0.5, 0.06);
        
        group.add(frame);
        group.add(plane);

        group.position.set(x, y, z);
        group.lookAt(x*2, y, z*2);

        const sr = 35;
        const sa = Math.random() * Math.PI * 2;
        
        group.userData = {
          treePos: new THREE.Vector3(x, y, z),
          treeRot: group.rotation.clone(),
          scatterPos: new THREE.Vector3(
             sr * Math.cos(sa),
             (Math.random()-0.5)*20,
             sr * Math.sin(sa)
          ),
          scatterRot: new THREE.Euler(Math.random()*3, Math.random()*3, 0),
        };

        photoGroup.add(group);
        photoMeshes.push(group);
      }

      function animate() {
        requestAnimationFrame(animate);
        const dt = clock.getDelta();

        // Rotation Logic
        if (STATE.mode === 'SCATTER' && STATE.hand.detected) {
           const tx = STATE.hand.x * Math.PI;
           const ty = STATE.hand.y * Math.PI * 0.3;
           mainGroup.rotation.y += (tx - mainGroup.rotation.y) * 2 * dt;
           mainGroup.rotation.x += (ty - mainGroup.rotation.x) * 2 * dt;
        } else if (STATE.mode === 'FOCUS') {
           mainGroup.rotation.y += 0.05 * dt;
           mainGroup.rotation.x *= 0.95;
        } else {
           mainGroup.rotation.y += STATE.autoRotateSpeed * dt;
           mainGroup.rotation.x *= 0.95;
        }

        // Background rotate slowly
        backgroundGroup.rotation.y -= 0.02 * dt;
        backgroundGroup.rotation.x += 0.01 * dt;

        const lerpFactor = 3.0 * dt;

        // Tree
        for(let i=0; i<CONFIG.tree.particleCount; i++) {
          const d = treeData[i];
          const target = (STATE.mode === 'SCATTER' || STATE.mode === 'FOCUS') ? d.scatterPos : d.treePos;
          d.currentPos.lerp(target, lerpFactor);
          dummy.position.copy(d.currentPos);
          dummy.rotation.copy(d.rot);
          let s = d.scale;
          if(STATE.mode === 'TREE') {
             s *= (0.85 + 0.15 * Math.sin(clock.elapsedTime * 3 + i));
          }
          dummy.scale.setScalar(s);
          dummy.updateMatrix();
          treeMesh.setMatrixAt(i, dummy.matrix);
        }
        treeMesh.instanceMatrix.needsUpdate = true;

        // Ornaments
        for(let i=0; i<CONFIG.ribbon.sphereCount; i++) {
          const d = ornamentData[i];
          const target = (STATE.mode === 'SCATTER' || STATE.mode === 'FOCUS') ? d.scatterPos : d.treePos;
          d.currentPos.lerp(target, lerpFactor);
          dummy.position.copy(d.currentPos);
          dummy.scale.setScalar(d.scale);
          dummy.updateMatrix();
          ornamentMesh.setMatrixAt(i, dummy.matrix);
        }
        ornamentMesh.instanceMatrix.needsUpdate = true;

        // Photos
        photoMeshes.forEach((mesh, idx) => {
          const d = mesh.userData;
          let targetPos = (STATE.mode === 'SCATTER') ? d.scatterPos : d.treePos;
          if (STATE.mode === 'FOCUS' && idx === STATE.focusIndex) {
            mesh.lookAt(camera.position);
            targetPos = d.treePos; 
            const s = 1.5;
            mesh.scale.lerp(new THREE.Vector3(s,s,s), lerpFactor);
          } else {
             mesh.scale.lerp(new THREE.Vector3(1,1,1), lerpFactor);
             if (STATE.mode === 'TREE') {
               mesh.rotation.copy(d.treeRot);
             }
          }
          mesh.position.lerp(targetPos, lerpFactor);
        });

        // Snow (Foreground)
        if(snowPoints) {
           const positions = snowPoints.geometry.attributes.position.array;
           const vels = snowPoints.geometry.userData.velocities;
           for(let i=0; i<CONFIG.snow.count; i++) {
             positions[i*3] += vels[i*3];     
             positions[i*3+1] += vels[i*3+1]; 
             positions[i*3+2] += vels[i*3+2]; 
             if(positions[i*3+1] < -CONFIG.snow.range/2) {
                positions[i*3+1] = CONFIG.snow.range/2;
             }
           }
           snowPoints.geometry.attributes.position.needsUpdate = true;
           snowPoints.rotation.y = -mainGroup.rotation.y * 0.5; 
        }

        // Background Snow (Slower)
        if(bgSnowPoints) {
           const positions = bgSnowPoints.geometry.attributes.position.array;
           const vels = bgSnowPoints.geometry.userData.velocities;
           const count = positions.length / 3;
           const range = 120;
           for(let i=0; i<count; i++) {
             positions[i*3] += vels[i*3];     
             positions[i*3+1] += vels[i*3+1]; 
             positions[i*3+2] += vels[i*3+2]; 
             if(positions[i*3+1] < -range/2) {
                positions[i*3+1] = range/2;
             }
           }
           bgSnowPoints.geometry.attributes.position.needsUpdate = true;
           bgSnowPoints.rotation.y = -mainGroup.rotation.y * 0.2; // Very slow rotation
        }

        // Update bigSnowPoints (New Layer)
        if(bigSnowPoints) {
           const positions = bigSnowPoints.geometry.attributes.position.array;
           const vels = bigSnowPoints.geometry.userData.velocities;
           const count = positions.length / 3;
           const range = 100;
           for(let i=0; i<count; i++) {
             positions[i*3] += vels[i*3];     
             positions[i*3+1] += vels[i*3+1]; 
             positions[i*3+2] += vels[i*3+2]; 
             if(positions[i*3+1] < -range/2) {
                positions[i*3+1] = range/2;
             }
           }
           bigSnowPoints.geometry.attributes.position.needsUpdate = true;
           bigSnowPoints.rotation.y = -mainGroup.rotation.y * 0.1;
           bigSnowPoints.rotation.x = Math.sin(clock.elapsedTime * 0.1) * 0.1;
        }

        // Real Snow Animation
        if(realSnowMesh) {
            for(let i=0; i<realSnowData.length; i++) {
               const d = realSnowData[i];
               d.pos.add(d.vel);
               // Recycle when out of bounds
               if(d.pos.y < -40) d.pos.y = 40;
               if(d.pos.x > 40) d.pos.x = -40;
               if(d.pos.x < -40) d.pos.x = 40;
               
               d.rot.x += d.rotVel.x;
               d.rot.y += d.rotVel.y;
               d.rot.z += d.rotVel.z;
               
               dummy.position.copy(d.pos);
               dummy.rotation.copy(d.rot);
               dummy.updateMatrix();
               realSnowMesh.setMatrixAt(i, dummy.matrix);
            }
            realSnowMesh.instanceMatrix.needsUpdate = true;
        }

        composer.render();
      }

      init();
    </script>
  </body>
</html>
